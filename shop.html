<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind Python Shop</title>
<link rel="stylesheet" href="styles.css">
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  overflow: hidden;
  font-family: "Trebuchet MS", Arial, sans-serif;

  background-color: #c89b6e;
  background-image:
    radial-gradient(ellipse at 18% 11%, rgba(255,255,255,.16), transparent 26%),
    radial-gradient(ellipse at 78% 92%, rgba(80,39,17,.10), transparent 31%),
    repeating-linear-gradient(2deg,
      rgba(92,47,20,.030) 0px,
      rgba(92,47,20,.030) 1px,
      transparent 2px,
      transparent 13px),
    repeating-linear-gradient(178deg,
      transparent 0px,
      transparent 33px,
      rgba(255,255,255,.026) 34px,
      transparent 36px,
      transparent 77px),
    linear-gradient(104deg,#d9b184 0%,#cfa375 36%,#d5aa7b 62%,#c39467 100%);
  background-size: auto, auto, 100% 27px, 100% 91px, auto;
  background-position: center;
  background-repeat: no-repeat, no-repeat, repeat, repeat, no-repeat;
  background-attachment: fixed;
}

.shop-stage {
  width: 100%;
  min-height: 100vh;
  display: grid;
  place-items: center;
}

.landscape-phone {
  width: min(950px, 92vw);
  aspect-ratio: 16 / 9;
  position: relative;
  padding: 14px;
  border: 7px solid #151419;
  border-radius: 54px;
  background: #2a292d;
  box-shadow:
    0 24px 35px rgba(48,24,12,.32),
    inset 0 0 0 2px #45434a;
}

.landscape-screen {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  border-radius: 38px;
  border: 2px solid #050505;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,255,255,.12), transparent 36%),
    linear-gradient(145deg, #30243d, #16111d 68%, #09070d);
}

.phone-speaker {
  position: absolute;
  left: 50%;
  top: 4px;
  transform: translateX(-50%);
  width: 96px;
  height: 7px;
  border-radius: 8px;
  background: #090909;
  z-index: 30;
}

.phone-camera {
  position: absolute;
  left: calc(50% + 67px);
  top: 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10232b;
  z-index: 30;
}

.shop-home {
  height: 100%;
  padding: 34px 36px 25px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 16px;
}

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

h1 {
  margin: 0;
  color: #f4d35e;
  font-size: clamp(27px, 4vw, 43px);
  line-height: .88;
  text-shadow: 4px 4px #8d315d;
}

.subtitle {
  margin: 9px 0 0;
  color: #ddd3e2;
  font: 700 11px "Courier New", monospace;
}

.home-button {
  color: white;
  text-decoration: none;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 10px;
  padding: 9px 12px;
  background: rgba(0,0,0,.25);
  font: 900 10px "Courier New", monospace;
}

.product-grid {
  align-self: center;
  justify-self: center;
  width: min(620px, 90%);
  display: grid;
  grid-template-columns: repeat(3, minmax(130px, 1fr));
  gap: clamp(18px, 4vw, 42px);
}

.product-icon {
  appearance: none;
  border: 0;
  padding: 0;
  background: transparent;
  color: white;
  text-align: center;
  cursor: none;
  font: inherit;
}

.icon-tile {
  width: clamp(135px, 18vw, 190px);
  aspect-ratio: 1;
  margin: 0 auto 13px;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 31px;
  border: 3px solid rgba(255,255,255,.24);
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.22), transparent 25%),
    linear-gradient(145deg, #66cddd, #4773c2 70%);
  box-shadow:
    0 13px 22px rgba(0,0,0,.38),
    inset 0 2px rgba(255,255,255,.28),
    inset 0 -8px rgba(0,0,0,.13);
  transition: transform .14s ease, filter .14s ease;
}

.mug .icon-tile {
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.22), transparent 25%),
    linear-gradient(145deg, #ffaecc, #b65ca5 70%);
}

.product-icon:hover .icon-tile {
  transform: translateY(-6px) scale(1.035);
  filter: brightness(1.08);
}

.product-icon:active .icon-tile {
  transform: scale(.94);
}

.product-name {
  display: block;
  font: 900 clamp(11px, 1.5vw, 15px) "Courier New", monospace;
  text-transform: uppercase;
  text-shadow: 2px 2px #000;
}


.tote .icon-tile {
  background:
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.22), transparent 25%),
    linear-gradient(145deg, #f1c86f, #d88d55 70%);
}


.pixel-product-tile {
  image-rendering: pixelated;
  overflow: visible;
}

.blue-tile {
  background: linear-gradient(145deg, #75d9e8, #4978c5 72%);
}

.pink-tile {
  background: linear-gradient(145deg, #ffb5d1, #be62a9 72%);
}

.yellow-tile {
  background: linear-gradient(145deg, #f7db78, #d68d53 72%);
}

.pixel-shirt,
.pixel-mug,
.pixel-tote {
  position: relative;
  display: block;
  filter: drop-shadow(6px 7px 0 rgba(0,0,0,.25));
}

.pixel-shirt {
  width: 74px;
  height: 64px;
  background: #f7f1df;
  border: 7px solid #2b2531;
  box-shadow:
    -20px 0 0 -7px #f7f1df,
    -27px 0 0 -7px #2b2531,
    20px 0 0 -7px #f7f1df,
    27px 0 0 -7px #2b2531;
}

.pixel-shirt::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -7px;
  width: 24px;
  height: 16px;
  transform: translateX(-50%);
  background: #5fb6d2;
  border-left: 7px solid #2b2531;
  border-right: 7px solid #2b2531;
  border-bottom: 7px solid #2b2531;
}

.pixel-shirt-logo,
.pixel-mug-logo,
.pixel-tote-logo {
  position: absolute;
  left: 50%;
  top: 52%;
  transform: translate(-50%, -50%);
  color: #d64079;
  font: 900 17px "Courier New", monospace;
}

.pixel-mug {
  width: 64px;
  height: 67px;
  background: #f7f1df;
  border: 7px solid #2b2531;
}

.pixel-mug::before {
  content: "";
  position: absolute;
  right: -29px;
  top: 11px;
  width: 23px;
  height: 35px;
  border: 7px solid #2b2531;
  border-left: 0;
  background: transparent;
}

.pixel-mug::after {
  content: "";
  position: absolute;
  left: -7px;
  right: -7px;
  top: -7px;
  height: 8px;
  background: #ef8daf;
  border-bottom: 7px solid #2b2531;
}

.pixel-mug-logo {
  color: #4d8fbd;
}

.pixel-tote {
  width: 80px;
  height: 66px;
  margin-top: 18px;
  background: #eee5cf;
  border: 7px solid #2b2531;
}

.pixel-tote::before,
.pixel-tote::after {
  content: "";
  position: absolute;
  top: -34px;
  width: 17px;
  height: 33px;
  border: 7px solid #2b2531;
  border-bottom: 0;
  background: transparent;
}

.pixel-tote::before {
  left: 10px;
}

.pixel-tote::after {
  right: 10px;
}

.pixel-tote-logo {
  color: #c8733d;
  top: 56%;
}

@media (max-width: 700px) {
  .pixel-shirt {
    transform: scale(.76);
  }

  .pixel-mug {
    transform: scale(.76);
  }

  .pixel-tote {
    transform: scale(.76);
  }
}

/* CSS T-shirt icon */
.shirt-shape {
  width: 58%;
  height: 54%;
  position: relative;
  background: #f8f1df;
  border: 4px solid #292331;
  border-radius: 9px 9px 15px 15px;
  box-shadow: inset 0 -8px rgba(0,0,0,.07);
}

.shirt-shape::before,
.shirt-shape::after {
  content: "";
  position: absolute;
  top: 1px;
  width: 36%;
  height: 39%;
  background: #f8f1df;
  border: 4px solid #292331;
  z-index: -1;
}

.shirt-shape::before {
  left: -24%;
  transform: rotate(30deg);
  border-radius: 9px 3px 7px 9px;
}

.shirt-shape::after {
  right: -24%;
  transform: rotate(-30deg);
  border-radius: 3px 9px 9px 7px;
}

.shirt-neck {
  position: absolute;
  top: -4px;
  left: 50%;
  width: 29%;
  height: 19%;
  transform: translateX(-50%);
  border: 4px solid #292331;
  border-top: 0;
  border-radius: 0 0 30px 30px;
  background: #78cbd8;
}

.shirt-logo {
  position: absolute;
  left: 50%;
  top: 46%;
  transform: translate(-50%, -50%);
  color: #d83f78;
  font: 900 20px "Courier New", monospace;
}

/* CSS mug icon */
.mug-shape {
  width: 49%;
  height: 57%;
  position: relative;
  border: 4px solid #292331;
  border-radius: 8px 8px 18px 18px;
  background: #f7f1df;
  box-shadow: inset 0 -9px rgba(0,0,0,.07);
}

.mug-shape::before {
  content: "";
  position: absolute;
  right: -36%;
  top: 16%;
  width: 39%;
  height: 49%;
  border: 5px solid #292331;
  border-left: 0;
  border-radius: 0 22px 22px 0;
}

.mug-shape::after {
  content: "WP";
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #4e91bd;
  font: 900 21px "Courier New", monospace;
}

.shop-note {
  text-align: center;
  color: #92e8ff;
  font: 900 9px "Courier New", monospace;
  letter-spacing: 1px;
}

/* Product detail view */
.product-view {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  grid-template-rows: auto 1fr;
  gap: 13px;
  padding: 22px 25px 23px;
  background:
    radial-gradient(circle at 50% 0%, rgba(255,255,255,.08), transparent 35%),
    linear-gradient(145deg, #24202c, #0c0a10);
  animation: openProduct .2s ease;
}

.product-view.hidden {
  display: none;
}

@keyframes openProduct {
  from { opacity: 0; transform: scale(.985); }
  to { opacity: 1; transform: scale(1); }
}

.detail-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.detail-heading {
  color: #f4d35e;
  font: 900 15px "Courier New", monospace;
  text-shadow: 2px 2px #73244b;
}

.back-button {
  appearance: none;
  border: 1px solid rgba(255,255,255,.3);
  border-radius: 9px;
  padding: 8px 11px;
  background: #1b171e;
  color: white;
  font: 900 10px "Courier New", monospace;
  cursor: none;
}

.detail-content {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(250px, .92fr) minmax(280px, 1.08fr);
  gap: 24px;
}

.product-image-frame {
  min-height: 0;
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
  border: 3px solid rgba(255,255,255,.18);
  border-radius: 19px;
  background:
    repeating-linear-gradient(
      45deg,
      rgba(255,255,255,.035) 0,
      rgba(255,255,255,.035) 12px,
      transparent 12px,
      transparent 24px
    ),
    #141118;
  box-shadow: inset 0 0 28px rgba(0,0,0,.55);
}

.real-product-image {
  display: none;
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 12px;
}

.image-placeholder {
  width: 80%;
  text-align: center;
  color: #8e8794;
}

.placeholder-symbol {
  display: block;
  margin-bottom: 14px;
  font-size: clamp(62px, 10vw, 110px);
  line-height: 1;
  filter: grayscale(.35);
}

.placeholder-text {
  display: block;
  font: 900 11px "Courier New", monospace;
  letter-spacing: 1px;
}

.placeholder-subtext {
  display: block;
  margin-top: 7px;
  color: #625d68;
  font: 700 9px "Courier New", monospace;
}

.product-info {
  min-height: 0;
  overflow-y: auto;
  padding: 1px 8px 4px 0;
  scrollbar-width: thin;
}

.product-title {
  margin: 0;
  color: white;
  font-size: clamp(24px, 3.5vw, 39px);
  line-height: .94;
}

.product-type {
  display: block;
  margin-top: 6px;
  color: #8ee8ff;
  font: 900 10px "Courier New", monospace;
  letter-spacing: 1px;
}

.description {
  margin: 18px 0 19px;
  color: #dbd4df;
  font: 700 12px/1.5 "Courier New", monospace;
}

.info-heading {
  margin: 16px 0 8px;
  color: #f4d35e;
  font: 900 11px "Courier New", monospace;
  letter-spacing: 1px;
}

.option-row {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.option {
  appearance: none;
  min-width: 38px;
  border: 1px solid rgba(255,255,255,.32);
  border-radius: 7px;
  padding: 7px 9px;
  color: white;
  background: rgba(255,255,255,.06);
  font: 900 10px "Courier New", monospace;
  cursor: none;
}

.option.selected {
  color: #17111c;
  background: #f4d35e;
  border-color: #f4d35e;
}

.detail-list {
  margin: 4px 0 0;
  padding-left: 17px;
  color: #beb6c3;
  font: 700 10px/1.65 "Courier New", monospace;
}

.cart-placeholder {
  width: 100%;
  margin-top: 18px;
  appearance: none;
  border: 0;
  border-radius: 11px;
  padding: 12px;
  color: #1b1220;
  background: #f4d35e;
  font: 900 11px "Courier New", monospace;
  cursor: none;
  box-shadow: 0 5px 0 #9a6e18;
}

.cart-placeholder:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #9a6e18;
}

.cart-message {
  min-height: 16px;
  margin-top: 9px;
  color: #8ee8ff;
  text-align: center;
  font: 900 9px "Courier New", monospace;
}

@media (max-width: 700px) {
  body { padding: 8px; }

  .landscape-phone {
    width: 99vw;
    padding: 9px;
    border-width: 5px;
    border-radius: 28px;
  }

  .landscape-screen { border-radius: 18px; }

  .shop-home {
    padding: 25px 14px 14px;
    gap: 8px;
  }

  .subtitle, .shop-note { display: none; }

  .product-grid {
    width: 90%;
    grid-template-columns: repeat(3, minmax(82px, 1fr));
    gap: 12px;
  }

  .icon-tile {
    width: min(110px, 25vw);
    border-radius: 20px;
  }

  .detail-content {
    grid-template-columns: .9fr 1.1fr;
    gap: 13px;
  }

  .product-view {
    padding: 17px 16px 14px;
  }

  .product-image-frame {
    border-radius: 12px;
  }

  .description {
    margin: 10px 0;
    font-size: 9px;
    line-height: 1.35;
  }

  .product-title { font-size: 21px; }

  .info-heading { margin: 9px 0 5px; }

  .option {
    min-width: 31px;
    padding: 5px 6px;
    font-size: 8px;
  }

  .detail-list {
    font-size: 8px;
    line-height: 1.4;
  }

  .cart-placeholder {
    margin-top: 9px;
    padding: 8px;
    font-size: 9px;
  }
}
</style>
</head>
<body>
<main class="shop-stage">
  <section class="landscape-phone" aria-label="Wind Python shop">
    <div class="phone-speaker"></div>
    <div class="phone-camera"></div>

    <div class="landscape-screen">
      <section class="shop-home">
        <header class="topbar">
          <div>
            <h1>WIND PYTHON<br>SHOP</h1>
            <p class="subtitle">Tap an item to take a closer look.</p>
          </div>
          <a class="home-button" href="index.html">HOME</a>
        </header>

        <div class="product-grid">
          <button class="product-icon tshirt" data-product="tshirt">
            <span class="icon-tile pixel-product-tile blue-tile">
              <span class="pixel-shirt" aria-hidden="true">
                <span class="pixel-shirt-logo">WP</span>
              </span>
            </span>
            <span class="product-name">T-Shirt</span>
          </button>

          <button class="product-icon mug" data-product="mug">
            <span class="icon-tile pixel-product-tile pink-tile">
              <span class="pixel-mug" aria-hidden="true">
                <span class="pixel-mug-logo">WP</span>
              </span>
            </span>
            <span class="product-name">Mug</span>
          </button>

          <button class="product-icon tote" data-product="tote">
            <span class="icon-tile pixel-product-tile yellow-tile">
              <span class="pixel-tote" aria-hidden="true">
                <span class="pixel-tote-logo">WP</span>
              </span>
            </span>
            <span class="product-name">Tote Bag</span>
          </button>
        </div>

        <div class="shop-note">SINGLE CLICK TO VIEW PRODUCT</div>
      </section>

      <section class="product-view hidden" id="productView">
        <div class="detail-top">
          <div class="detail-heading">WIND PYTHON SHOP</div>
          <button class="back-button" id="backButton">BACK TO ITEMS</button>
        </div>

        <div class="detail-content">
          <div class="product-image-frame">
            <img class="real-product-image" id="realProductImage" src="" alt="">
            <div class="image-placeholder" id="imagePlaceholder">
              <span class="placeholder-symbol" id="placeholderSymbol">👕</span>
              <span class="placeholder-text">REAL PRODUCT IMAGE GOES HERE</span>
              <span class="placeholder-subtext">We will replace this when your photo is supplied.</span>
            </div>
          </div>

          <div class="product-info">
            <h2 class="product-title" id="productTitle">Wind Python T-Shirt</h2>
            <span class="product-type" id="productType">OFFICIAL MERCHANDISE</span>

            <p class="description" id="productDescription"></p>

            <div id="sizeSection">
              <div class="info-heading">SELECT SIZE</div>
              <div class="option-row" id="sizeOptions"></div>
            </div>

            <div class="info-heading">PRODUCT DETAILS</div>
            <ul class="detail-list" id="detailList"></ul>

            <button class="cart-placeholder" id="cartButton">ADD TO BAG</button>
            <div class="cart-message" id="cartMessage"></div>
          </div>
        </div>
      </section>
    </div>
  </section>
</main>

<script src="script.js"></script>
<script src="cursor.js"></script>
<script>
const products = {
  tshirt: {
    title: "Wind Python T-Shirt",
    type: "OFFICIAL WIND PYTHON CLOTHING",
    symbol: "👕",
    image: "assets/images/shop/wind-python-shirt.png",
    description:
      "A white Wind Python T-shirt featuring the Rainbow Adventure artwork with Wind Python and Bazinga beneath the rainbow. A bright, wearable slice of the Wind Python universe.",
    sizes: ["S", "M", "L", "XL", "2XL"],
    details: [
      "White short-sleeve T-shirt",
      "Front-centre Rainbow Adventure print",
      "Unisex sizing",
      "Final fabric, fit and care details will be confirmed through the print-on-demand supplier"
    ]
  },
  mug: {
    title: "Wind Python Mug",
    type: "OFFICIAL WIND PYTHON DRINKWARE",
    symbol: "☕",
    image: "assets/images/shop/wind-python-mug.png",
    description:
      "A white Wind Python mug with a pink handle and rim, finished with the Rainbow Adventure artwork on the front. Built for tea, coffee and suspiciously colourful beverages.",
    sizes: [],
    details: [
      "White ceramic-style mug",
      "Pink handle and rim",
      "Front Rainbow Adventure print",
      "Final capacity and care instructions will be confirmed through the print-on-demand supplier"
    ]
  },
  tote: {
    title: "Wind Python Tote Bag",
    type: "OFFICIAL WIND PYTHON ACCESSORY",
    symbol: "👜",
    image: "assets/images/shop/wind-python-tote.png",
    description:
      "A natural-colour Wind Python tote bag featuring the Rainbow Adventure artwork. Useful for records, groceries, strange gadgets and whatever Bazinga has built this week.",
    sizes: [],
    details: [
      "Natural canvas-style tote",
      "Long shoulder straps",
      "Front-centre Rainbow Adventure print",
      "Final dimensions, material weight and care details will be confirmed through the print-on-demand supplier"
    ]
  }
};

const productView = document.getElementById("productView");
const productTitle = document.getElementById("productTitle");
const productType = document.getElementById("productType");
const productDescription = document.getElementById("productDescription");
const placeholderSymbol = document.getElementById("placeholderSymbol");
const imagePlaceholder = document.getElementById("imagePlaceholder");
const realProductImage = document.getElementById("realProductImage");
const sizeSection = document.getElementById("sizeSection");
const sizeOptions = document.getElementById("sizeOptions");
const detailList = document.getElementById("detailList");
const cartMessage = document.getElementById("cartMessage");

function openProduct(productKey) {
  const product = products[productKey];

  productTitle.textContent = product.title;
  productType.textContent = product.type;
  productDescription.textContent = product.description;
  placeholderSymbol.textContent = product.symbol;
  cartMessage.textContent = "";

  if (product.image) {
    realProductImage.src = product.image;
    realProductImage.alt = product.title;
    realProductImage.style.display = "block";
    imagePlaceholder.style.display = "none";
  } else {
    realProductImage.style.display = "none";
    realProductImage.removeAttribute("src");
    imagePlaceholder.style.display = "block";
  }

  sizeOptions.innerHTML = "";
  if (product.sizes.length) {
    sizeSection.style.display = "block";
    product.sizes.forEach((size, index) => {
      const button = document.createElement("button");
      button.className = "option" + (index === 0 ? " selected" : "");
      button.textContent = size;
      button.addEventListener("click", () => {
        sizeOptions.querySelectorAll(".option").forEach(option =>
          option.classList.remove("selected")
        );
        button.classList.add("selected");
      });
      sizeOptions.appendChild(button);
    });
  } else {
    sizeSection.style.display = "none";
  }

  detailList.innerHTML = "";
  product.details.forEach(detail => {
    const item = document.createElement("li");
    item.textContent = detail;
    detailList.appendChild(item);
  });

  productView.classList.remove("hidden");
}

document.querySelectorAll(".product-icon").forEach(button => {
  button.addEventListener("click", () => openProduct(button.dataset.product));
});

document.getElementById("backButton").addEventListener("click", () => {
  productView.classList.add("hidden");
  cartMessage.textContent = "";
});

document.getElementById("cartButton").addEventListener("click", () => {
  cartMessage.textContent = "SHOPPING BAG AND CHECKOUT WILL BE CONNECTED LATER.";
});
</script>
</body>
</html>
