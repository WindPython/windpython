<script id="chaseLauncherController">
(() => {
  const launchers = document.querySelectorAll('[data-chase-launcher="true"]');
  const audio = document.getElementById('chaseLauncherAudio');
  const overlay = document.getElementById('chaseAppOverlay');
  const frame = document.getElementById('chaseAppFrame');

  if (!launchers.length || !audio || !overlay || !frame) return;

  function stopTitleAudio(){
    audio.pause();
    audio.currentTime = 0;
  }

  function closeChase(){
    stopTitleAudio();
    frame.src = 'about:blank';
    document.body.classList.remove('chase-open');
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
  }

  launchers.forEach((launcher) => {
    launcher.addEventListener('click', (event) => {
      event.preventDefault();

      // This starts inside the app-icon click, so mobile browsers permit it.
      audio.currentTime = 0;
      audio.loop = true;
      audio.volume = 0.25;
      audio.play().catch(() => {});

      document.body.classList.add('chase-open');
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      frame.src = 'nathaniel-chase.html?embedded=1&v=20260801-1205';
    });
  });

  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow) return;

    if (event.data === 'chase-game-started') {
      stopTitleAudio();
    }

    if (event.data === 'close-chase-app') {
      closeChase();
    }
  });
})();
</script>

<script id="unlockClickReliabilityFix">
// Fallback audio player; successful-unlock timing is controlled by script.js.
(() => {
  const unlockAudio = document.getElementById("phoneUnlockClick");
  if (!unlockAudio) return;

  unlockAudio.preload = "auto";

  window.playPhoneUnlockClick = function() {
    try {
      unlockAudio.pause();
      unlockAudio.currentTime = 0;
      const p = unlockAudio.play();
      if (p && typeof p.catch === "function") p.catch(() => {});
    } catch (_) {}
  };

  // Re-arm audio after returning to the phone home screen.
  window.addEventListener("pageshow", () => {
    try {
      unlockAudio.pause();
      unlockAudio.currentTime = 0;
      unlockAudio.load();
    } catch (_) {}
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      try {
        unlockAudio.pause();
        unlockAudio.currentTime = 0;
      } catch (_) {}
    }
  });
})();
</script>
<script id="chaseCursorRestoreGuard">

  if (!overlay || !overlay.classList.contains("open")) {
    document.body.classList.remove("chase-open");
  }
});
</script>


<script id="flightReturnMessageBridge">
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "bazinga-close-flight") return;

  const possibleOverlays = [
    document.getElementById("gameAppOverlay"),
    document.getElementById("flightAppOverlay"),
    document.getElementById("chaseAppOverlay"),
    document.querySelector(".app-overlay.open"),
    document.querySelector(".game-overlay.open"),
    document.querySelector("[class*='overlay'].open")
  ].filter(Boolean);

  possibleOverlays.forEach((overlay) => {
    overlay.classList.remove("open", "active");
    overlay.setAttribute("aria-hidden", "true");

    const frame = overlay.querySelector("iframe");
    if (frame) {
      frame.src = "about:blank";
    }
  });

  document.body.classList.remove("chase-open", "game-open", "app-open");

  const parentCursor = document.getElementById("wp-custom-cursor");
  if (parentCursor) {
    parentCursor.style.display = "";
    parentCursor.style.opacity = "1";
    parentCursor.style.visibility = "visible";
  }
});
</script>


<script id="flightReturnDynamicBridge">
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "bazinga-close-flight") return;

  for (const frame of document.querySelectorAll("iframe")) {
    if (frame.contentWindow === event.source) {
      const container =
        frame.closest(".app-overlay, .game-overlay, [id$='Overlay'], [class*='overlay']");

      if (container) {
        container.classList.remove("open", "active", "visible");
        container.setAttribute("aria-hidden", "true");
      }

      frame.src = "about:blank";
      break;
    }
  }
});
</script>
